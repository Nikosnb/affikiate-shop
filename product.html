<!DOCTYPE html>
<html>
<head>
<title>Product</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

  <header style="background-color:rgba(171, 126, 234, 0.071);">
  <div class="logo"><a href="index.html">TonnyShop</a></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="checkout.html">Cart 🛒</a>
    <a href="favorites.html">Favorites ❤️</a>
  </nav>
</header>

<h2 id="name" style="margin-left:10px"></h2>
<img id="image" width="200" style="margin-left: 10px;">
<p id="price" style="margin-left:10px"></p>

<button onclick="addToCart()">Add to Cart</button>

<h3>Customer Reviews</h3>

<h4>⭐ 4.4 / 5 (120 reviews)</h4>

<div id="reviews"></div>

<script>
let product = JSON.parse(localStorage.getItem("currentProduct"));

document.getElementById("name").innerText = product.name;
document.getElementById("price").innerText = "$" + product.price;
document.getElementById("image").src = product.image;

function addToCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push(product);
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart");
}
</script>

<script>
const reviews = [
  { name: "Ivan", rating: 5, text: "Много добър продукт!" },
  { name: "Maria", rating: 4, text: "Харесва ми, но доставката беше бавна." },
  { name: "Georgi", rating: 5, text: "Топ качество!" },
  { name: "Anna", rating: 4, text: "Струва си за цената." },
  { name: "Petar", rating: 3, text: "Окей е, нищо специално." }
];

function loadReviews() {
  const container = document.getElementById("reviews");

  reviews.forEach(r => {
    let stars = "⭐".repeat(r.rating);

    container.innerHTML += `
      <div style="background:#fff; padding:10px; margin:10px 0; border-radius:10px;">
        <strong>${r.name}</strong><br>
        ${stars}<br>
        <p>${r.text}</p>
      </div>
    `;
  });
}

loadReviews();
</script>

</body>
</html>
